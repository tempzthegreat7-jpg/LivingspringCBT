<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livingspring CBT</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="transitions.css" />
  </head>
  <body>
    <div class="transition transition-1 is-active"></div>

    <h1 class="primary-logo">Livingspring <span>Computer-Based Test</span></h1>
    <div class="role-container">
      <div class="prompt-question">
        <p>Please Confirm Your Role &RightArrow;</p>
      </div>
      <div class="prompt-answer">
        <a
          href="student-name.html"
          class="select"
          style="border-top: 1px solid #aaaaaa"
          >Student</a
        >
        <a
          href="teacher-login.html"
          class="select"
          style="border-top: 1px solid #aaaaaa"
          >Teacher</a
        >
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
