<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livingspring CBT | Teacher-panel</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <aside>
      <p><a href="role.html">logout</a></p>
      <h2>Teacher's Panel</h2>
      <a href="teacher-panel.html"
        ><i class="fa-light fa-panel-ews"></i>Dashboard</a
      >
      <a href="teacher-profile.html">Profile</a>
      <a href="set-questions.html" class="current">Set Questions</a>
    </aside>
    <section>
      <header>
        <h2>Livingspring CBT</h2>
        <div class="profile">
          <img src="img.jpg" alt="profile pic" />
          <div class="profile-bio">
            <p class="name">Mr Johnson</p>
            <p class="role">Biology Teacher</p>
          </div>
        </div>
      </header>
      <main>
        <h1>Questions</h1>
        <form action="">
          <div>
            <label for="">Number</label>
            <input type="number" class="select" />
          </div>
          <div>
            <label for="">Question:</label>
            <input type="text" class="select" />
          </div>
          <div class="grid">
            <div>
              <label for="">Choice 1:</label>
              <input type="text" class="select" name="" id="" />
            </div>
            <div>
              <label for="">Choice 2:</label>
              <input type="text" class="select" name="" id="" />
            </div>
            <div>
              <label for="">Choice 3:</label>
              <input type="text" class="select" name="" id="" />
            </div>
            <div>
              <label for="">Choice 4:</label>
              <input type="text" class="select" name="" id="" />
            </div>
          </div>
          <label for="">Correct Answer:</label>
          <input type="text" class="select" name="" id="" />
          <button type="submit" class="button" id="add">Add Question</button>
        </form>
      </main>
    </section>
  </body>
</html>
